# Lint, tests and build on every push and pull request, against the published edelweiss SDKs (go.sum and
# ui/package-lock.json). The steps only call make targets, so everything runs locally too.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Lint, test, integration tests and build
        run: make lint test test-docker build
